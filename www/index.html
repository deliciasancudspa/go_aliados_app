<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Go Aliados</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,sans-serif; background:#1A0033; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; text-align:center; }
  .loader { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .logo { font-size:64px; margin-bottom:20px; }
  .title { font-size:24px; font-weight:900; margin-bottom:8px; }
  .sub { color:rgba(255,255,255,0.5); font-size:14px; }
</style>
</head>
<body>
<div>
  <div class="logo">🛵</div>
  <div class="title">Go Aliados</div>
  <div class="sub loader">Cargando panel de negocio...</div>
</div>
</body>
</html>
